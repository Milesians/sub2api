name: Sync upstream release

on:
  schedule:
    # Forks do not receive release events from upstream; poll published releases.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Share the lock with the weekly main sync to avoid concurrent branch updates.
concurrency:
  group: sync-upstream-milesians
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Milesians/sub2api' && github.ref == 'refs/heads/milesians'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out milesians
        uses: actions/checkout@v6
        with:
          ref: milesians
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}

      - name: Merge the latest published release and trigger image publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/sync-tools/sync_upstream.py --mode release
