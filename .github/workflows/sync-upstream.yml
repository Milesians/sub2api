name: Sync upstream

on:
  schedule:
    # UTC 01:23, 07:23, 13:23, 19:23 / 北京时间 09:23, 15:23, 21:23, 03:23.
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-milesians
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Milesians/sub2api' && github.ref == 'refs/heads/milesians'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out milesians
        uses: actions/checkout@v6
        with:
          ref: milesians
          fetch-depth: 0
          # A dedicated deploy key also permits syncing upstream workflow files.
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}

      - name: Merge upstream and tag new releases on milesians
        run: python3 .github/sync-tools/sync_upstream.py
