name: Sync upstream main

on:
  schedule:
    # Sunday 19:23 UTC / 北京时间每周一 03:23.
    - cron: '23 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: sync-upstream-milesians
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Milesians/sub2api' && github.ref == 'refs/heads/milesians'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out milesians
        uses: actions/checkout@v6
        with:
          ref: milesians
          fetch-depth: 0
          # A dedicated deploy key also permits syncing upstream workflow files.
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}

      - name: Open an upstream main PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/sync-tools/sync_upstream.py --mode main
